name: Build SecureChat WebView APK

on:
  workflow_dispatch:
  push:
    paths:
      - "webview-client-source.zip.b64"
      - ".github/workflows/build-webview-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract original Android WebView client
        run: |
          base64 -d webview-client-source.zip.b64 > /tmp/webview-client.zip
          mkdir -p webview-client
          unzip -q /tmp/webview-client.zip -d webview-client
          python3 - <<'PY'
          from pathlib import Path
          p = Path("webview-client/web/index.html")
          s = p.read_text(encoding="utf-8")
          old = '<script src="nacl.min.js"></script>\n<script src="scrypt.js"></script>'
          new = '''<script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl-fast.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/scrypt-async@2.0.1/scrypt-async.js"></script>
          <script>
          const scryptFunction = window.scrypt;
          window.scrypt = {
            scrypt: (password, salt, N, r, parallel, dkLen) => new Promise((resolve, reject) => {
              try {
                scryptFunction(password, salt, {N, r, p: parallel, dkLen, encoding: "binary"}, resolve);
              } catch (error) { reject(error); }
            })
          };
          </script>'''
          if old not in s:
              raise SystemExit("Expected crypto script references were not found")
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY

      - name: Build WebView APK
        working-directory: webview-client/android
        run: gradle --no-daemon assembleDebug

      - name: Upload WebView APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureChat-WebView-debug-APK
          path: webview-client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
